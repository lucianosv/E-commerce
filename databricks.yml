bundle:
  name: ecommerce_silver

variables:
  catalogo:
    default: ecommerce

targets:
  dev:
    mode: development
    default: true

sync:
  paths:
    - pipeline
    - testes

resources:
  jobs:
    pipeline_ecommerce:
      name: Pipeline E-commerce
      tasks:
        # 1. Bronze: ingestao dos dados do data lake (S3/Supabase) para ecommerce.bronze.*
        - task_key: ingestao_bronze
          notebook_task:
            notebook_path: ./pipeline/bronze/01_ingestao_bronze_gabarito.py

        # 2. Silver + Gold: pipeline SDP que processa bronze -> silver (tabelas) e
        #    silver -> gold (materialized views) com expectations e deduplicacao
        - task_key: run_pipeline
          depends_on:
            - task_key: ingestao_bronze
          pipeline_task:
            pipeline_id: bf308547-b804-4997-aed4-522cb695cc28

        # 3. Testes: validacao de qualidade das tabelas silver e gold
        - task_key: run_tests
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ./testes/04_testes_qualidade.py
            base_parameters:
              catalogo: ecommerce
