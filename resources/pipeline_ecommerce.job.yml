# Pipeline diário: data lake → bronze (Aula 2) → silver → gold (Aula 3) → testes → documentação (Aula 4).
# A definicão inline em databricks.yml é a fonte da verdade; este arquivo espelha a mesma estrutura
# para referência e documentação.
resources:
  jobs:
    pipeline_ecommerce:
      name: Pipeline E-commerce

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        # A ingestão precisa das chaves do Supabase no secret scope (imersao/s3_key e s3_secret).
        # Depois de criá-las, troque para UNPAUSED.
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      parameters:
        - name: catalogo
          default: ${var.catalogo}

      tasks:
        # 1. Bronze: ingestão dos dados do data lake (S3/Supabase) para ecommerce.bronze.*
        - task_key: ingestao_bronze
          notebook_task:
            notebook_path: ./pipeline/bronze/01_ingestao_bronze_gabarito.py

        # 2. Silver + Gold: pipeline SDP que processa bronze -> silver (tabelas) e
        #    silver -> gold (materialized views) com expectations e deduplicacao
        - task_key: run_pipeline
          depends_on:
            - task_key: ingestao_bronze
          pipeline_task:
            pipeline_id: bf308547-b804-4997-aed4-522cb695cc28

        # 3. Testes: validação de qualidade das tabelas silver e gold
        - task_key: run_tests
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ./testes/04_testes_qualidade.py
            base_parameters:
              catalogo: ecommerce

        # 4. Documentação: aplica comentários nas tabelas gold para o Genie Space
        - task_key: preparar_dados_para_ia
          depends_on:
            - task_key: run_tests
          notebook_task:
            notebook_path: ./notebooks/aula-04/01_preparar_dados_para_ia.sql
            base_parameters:
              catalogo: ecommerce
